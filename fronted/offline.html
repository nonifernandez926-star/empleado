<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050b2a">
  <title>Sin conexión — Mi Asistente</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; text-align: center;
      background: radial-gradient(500px 300px at 90% -10%, rgba(61,107,255,.5), transparent 60%), #050b2a; color: #fff;
      font-family: "Manrope", -apple-system, "Segoe UI", system-ui, Roboto, sans-serif; }
    main { max-width: 340px; }
    .ico { width: 76px; height: 76px; margin: 0 auto 22px; border-radius: 24px; display: grid; place-items: center;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
    h1 { margin: 0 0 8px; font-size: 1.5rem; letter-spacing: -.02em; }
    p { margin: 0 0 24px; color: #c3cdf0; line-height: 1.5; }
    button { font: inherit; font-weight: 700; color: #0b1437; background: #fff; border: 0; border-radius: 16px; padding: 14px 28px; min-height: 48px; cursor: pointer; }
    button:active { transform: scale(.97); }
  </style>
</head>
<body>
  <main>
    <div class="ico" aria-hidden="true"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#9db8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 20h.01"/><path d="M3 3l18 18"/></svg></div>
    <h1>Sin conexión</h1>
    <p>Mi Asistente necesita internet para atender a tus clientes y mostrarte tu panel. Revisá tu conexión y probá de nuevo.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
