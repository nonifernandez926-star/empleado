<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050b2a">
  <meta name="robots" content="noindex">
  <title>Página no encontrada — Mi Asistente</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; text-align: center;
      background: radial-gradient(500px 300px at 90% -10%, rgba(61,107,255,.5), transparent 60%), #050b2a; color: #fff;
      font-family: "Manrope", -apple-system, "Segoe UI", system-ui, Roboto, sans-serif; }
    main { max-width: 340px; }
    .n { font-size: 4.5rem; font-weight: 800; letter-spacing: -.05em; line-height: 1; background: linear-gradient(135deg,#7fa2ff,#17c6ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { margin: 12px 0 8px; font-size: 1.35rem; letter-spacing: -.02em; }
    p { margin: 0 0 24px; color: #c3cdf0; line-height: 1.5; }
    a { display: inline-block; font-weight: 700; color: #0b1437; background: #fff; border-radius: 16px; padding: 14px 28px; min-height: 48px; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="n">404</div>
    <h1>No encontramos esta página</h1>
    <p>El enlace puede estar mal escrito o la página ya no existe.</p>
    <a href="/index.html">Ir al inicio</a>
  </main>
</body>
</html>
